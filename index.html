<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Визитка</title>
<style>
  /* Две системы оформления: Android (Material 3 Expressive) и iPhone (стекло). Выбор — по телефону. */
  :root {
    --ease-spring: cubic-bezier(.2, .9, .3, 1.15);
    --ease-out: cubic-bezier(.2, .8, .2, 1);
  }
  [data-os="android"] {
    --font: Roboto, "Google Sans Text", system-ui, sans-serif;
    --gap: 0px;
    --bg: #0e0e11;
    --scrim: rgba(10, 10, 14, .55);
    --bg-image-opacity: .55;
    --surface: #1d1d22;
    --on: #ecebf2;
    --muted: #aeacb7;
    --outline: rgba(255, 255, 255, .2);
    --tonal: #2c2c33;
    --strong: #e8e7ee;
    --on-strong: #18181c;
    --grip: rgba(255, 255, 255, .28);
  }
  [data-os="ios"] {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --gap: 10px;
    --bg: #e7ebf1;
    --scrim: rgba(255, 255, 255, .15);
    --bg-image-opacity: .7;
    --glass: rgba(255, 255, 255, .34);
    --glass-row: rgba(255, 255, 255, .42);
    --glass-stroke: rgba(255, 255, 255, .7);
    --glass-shine: rgba(255, 255, 255, .85);
    --on: #111114;
    --muted: rgba(17, 17, 20, .55);
    --grip: rgba(17, 17, 20, .18);
  }
  @media (prefers-color-scheme: light) {
    [data-os="android"] {
      --bg: #e6e5ec;
      --scrim: rgba(240, 239, 245, .45);
      --surface: #f6f5fa;
      --on: #1a1a1f;
      --muted: #5f5d69;
      --outline: rgba(0, 0, 0, .16);
      --tonal: #e4e2ec;
      --strong: #1f1f25;
      --on-strong: #f4f3f8;
      --grip: rgba(0, 0, 0, .2);
    }
  }
  @media (prefers-color-scheme: dark) {
    [data-os="ios"] {
      --bg: #0b0c10;
      --scrim: rgba(0, 0, 0, .3);
      --bg-image-opacity: .55;
      --glass: rgba(44, 44, 52, .38);
      --glass-row: rgba(70, 70, 80, .32);
      --glass-stroke: rgba(255, 255, 255, .16);
      --glass-shine: rgba(255, 255, 255, .28);
      --on: #f5f5f7;
      --muted: rgba(245, 245, 247, .6);
      --grip: rgba(255, 255, 255, .25);
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background: var(--bg);
    color: var(--on);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Фон: та же картинка, сильно размытая, — стеклу есть что преломлять. */
  .backdrop { position: fixed; inset: -12%; z-index: 0; overflow: hidden; }
  .backdrop img {
    width: 100%; height: 100%; object-fit: cover;
    filter: blur(56px) saturate(1.6);
    opacity: var(--bg-image-opacity);
    transform: scale(1.15);
  }
  .backdrop::after { content: ""; position: absolute; inset: 0; background: var(--scrim); }
  [data-os="ios"] .backdrop {
    background:
      radial-gradient(55% 35% at 18% 88%, rgba(120, 220, 170, .55), transparent 70%),
      radial-gradient(45% 30% at 88% 82%, rgba(250, 160, 190, .5), transparent 70%),
      radial-gradient(70% 45% at 50% 18%, rgba(170, 195, 255, .55), transparent 70%);
  }

  .stage {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding: 0 var(--gap) calc(var(--gap) + env(safe-area-inset-bottom));
  }
  .sheet {
    position: relative; width: 100%; max-width: 460px;
    padding: 12px 18px 20px;
    visibility: hidden;
  }
  [data-os="android"] .sheet {
    background: var(--surface);
    border-radius: 32px 32px 0 0;
    padding-bottom: calc(22px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 40px rgba(0, 0, 0, .25);
  }
  [data-os="ios"] .sheet {
    border-radius: 46px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid var(--glass-stroke);
    box-shadow: inset 0 1.5px 0 var(--glass-shine), inset 0 -1px 0 rgba(255, 255, 255, .2), 0 24px 70px rgba(0, 0, 0, .18);
  }
  /* Блик сверху — «жидкое стекло». */
  [data-os="ios"] .sheet::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(160deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 38%);
    mix-blend-mode: soft-light;
  }
  .grip { width: 36px; height: 5px; border-radius: 3px; background: var(--grip); margin: 0 auto 14px; }

  .hero-slot { display: none; height: 170px; justify-content: center; align-items: flex-end; }
  .hero { height: 170px; max-width: 80%; object-fit: contain; transform-origin: 50% 100%; }
  .cutout .hero-slot { display: flex; }

  .head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .cutout .head { grid-template-columns: 1fr; text-align: center; margin-top: 6px; }
  .avatar { width: 88px; height: 88px; border-radius: 26px; overflow: hidden; background: rgba(127, 127, 127, .2); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cutout .avatar { display: none; }
  h1 { font-size: 28px; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
  [data-os="ios"] h1 { font-weight: 700; letter-spacing: -.025em; }
  .sub { margin-top: 4px; font-size: 19px; line-height: 1.25; color: var(--muted); overflow-wrap: anywhere; }

  .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 18px; }
  .row {
    display: flex; align-items: center; gap: 14px; min-height: 64px; min-width: 0;
    padding: 10px 14px 10px 18px; border-radius: 24px;
    color: inherit; text-decoration: none;
    transition: transform .15s var(--ease-out), background-color .2s;
  }
  .row + .row, .actions + .row { margin-top: 10px; }
  .row:active, .save:active { transform: scale(.97); }
  .row svg, .save svg { width: 24px; height: 24px; flex: none; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .label { font-size: 17px; font-weight: 600; }
  .value { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chevron { opacity: .55; }
  .call { font-size: 16px; font-weight: 600; padding: 10px 6px; color: inherit; text-decoration: none; }
  .save {
    width: 64px; border-radius: 22px; display: grid; place-items: center;
    color: inherit; text-decoration: none; transition: transform .15s var(--ease-out);
  }
  .save svg { transform: rotate(0deg); }
  [data-os="ios"] .save svg { transform: rotate(-90deg); }

  [data-os="android"] .tg { border: 1.5px solid var(--outline); }
  [data-os="android"] .save { background: var(--tonal); }
  [data-os="android"] .phone { background: var(--strong); color: var(--on-strong); }
  [data-os="android"] .phone .value { color: inherit; opacity: .7; }

  [data-os="ios"] .row, [data-os="ios"] .save {
    background: var(--glass-row);
    border: 1px solid var(--glass-stroke);
    box-shadow: inset 0 1px 0 var(--glass-shine);
  }
  /* Цветное свечение снизу, как на стекле iOS 26. */
  [data-os="ios"] .phone {
    background:
      radial-gradient(60% 120% at 10% 100%, rgba(110, 210, 150, .45), transparent 70%),
      radial-gradient(50% 120% at 95% 110%, rgba(245, 150, 180, .4), transparent 70%),
      var(--glass-row);
  }

  .hidden { display: none !important; }
  :focus-visible { outline: 3px solid #7aa7ff; outline-offset: 2px; }
  .missing { margin: auto; text-align: center; color: var(--muted); font-size: 17px; padding: 24px; }
</style>
</head>
<body>
<div class="backdrop"><img id="bg" alt=""></div>
<main class="stage">
  <p class="missing hidden" id="missing">Визитка не найдена</p>
  <section class="sheet" id="sheet" aria-labelledby="title">
    <div class="grip"></div>
    <div class="hero-slot"><img class="hero" id="hero" alt=""></div>
    <header class="head">
      <div class="avatar"><img id="avatar" alt=""></div>
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
    </header>
    <div class="actions" id="actions">
      <a class="row tg" id="tg" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.6 11.3 20.4 4.5c.8-.3 1.6.3 1.4 1.4l-3 14.2c-.2 1-.9 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.4-.9.4l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L7 13.9l-4.6-1.4c-1-.3-1-1 .2-1.2z"/></svg>
        <span class="text"><span class="label">Telegram</span><span class="value">Написать в Telegram</span></span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a class="save" id="save" aria-label="Сохранить контакт">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9"/></svg>
      </a>
    </div>
    <div class="row phone" id="phone">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
      <span class="text"><span class="label" id="phoneLabel">Номер телефона</span><span class="value" id="phoneValue"></span></span>
      <a class="call" id="call">Позвонить</a>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const tokens = location.search.slice(1).split('&').filter(Boolean);
  const forced = tokens.find((t) => t === 'ios' || t === 'android');
  const id = (tokens.find((t) => t !== forced && !t.includes('=')) || 'demo').replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const os = forced || (isIOS ? 'ios' : 'android');
  document.documentElement.dataset.os = os;

  const MEDIA = /^m\/[a-z0-9_-]+\/[a-z0-9_.-]+(\?v=\d+)?$/i;
  const TELEGRAM = /^[a-z0-9_]{4,32}$/i;
  const PHONE = /^\+?[0-9 ()-]{5,20}$/;

  function formatPhone(raw) {
    const digits = raw.replace(/\D/g, '');
    const m = /^7(\d{3})(\d{3})(\d{2})(\d{2})$/.exec(digits.replace(/^8(?=\d{10}$)/, '7'));
    return m ? `+7 (${m[1]}) ${m[2]}-${m[3]}-${m[4]}` : raw;
  }

  function render(card) {
    const sheet = $('sheet');
    $('title').textContent = card.title || card.name || '';
    $('subtitle').textContent = card.subtitle || '';
    $('subtitle').classList.toggle('hidden', !card.subtitle);
    document.title = card.name || card.title || 'Визитка';

    const media = typeof card.media === 'string' && MEDIA.test(card.media) ? card.media : null;
    const cutout = Boolean(media && card.cutout);
    sheet.classList.toggle('cutout', cutout);
    if (media) {
      $('bg').src = media;
      (cutout ? $('hero') : $('avatar')).src = media;
    } else {
      document.querySelector('.avatar').classList.add('hidden');
      $('bg').classList.add('hidden');
    }

    const telegram = typeof card.telegram === 'string' ? card.telegram.replace(/^@/, '') : '';
    const phone = typeof card.phone === 'string' && PHONE.test(card.phone) ? card.phone : '';
    if (TELEGRAM.test(telegram)) {
      $('tg').href = `https://t.me/${telegram}`;
    } else {
      $('tg').remove();
    }
    if (phone) {
      $('phoneLabel').textContent = os === 'ios' ? 'Телефон' : 'Номер телефона';
      $('phoneValue').textContent = formatPhone(phone);
      $('call').href = `tel:${phone.replace(/[^\d+]/g, '')}`;
      // Без Telegram телефон встаёт на его место — рядом с кнопкой «сохранить».
      if (!$('tg')) $('actions').prepend($('phone'));
    } else {
      $('phone').remove();
    }
    if (card.vcard) {
      $('save').href = `c/${id}.vcf?v=${card.updated || 0}`;
      $('save').setAttribute('download', `${(card.name || 'contact').replace(/[\\/:*?"<>|]/g, '')}.vcf`);
    } else {
      $('save').remove();
      $('actions').style.gridTemplateColumns = '1fr';
    }
    if (!$('actions').children.length) $('actions').remove();
    return cutout;
  }

  function animateIn(cutout) {
    const sheet = $('sheet');
    sheet.style.visibility = 'visible';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !sheet.animate) return;

    sheet.animate([
      { transform: 'translateY(105%)', easing: 'cubic-bezier(.22,.9,.32,1)' },
      { transform: 'translateY(-1.5%)', offset: .7, easing: 'ease-in-out' },
      { transform: 'translateY(0)' },
    ], { duration: 800, fill: 'backwards' });

    const rows = [...sheet.querySelectorAll('.row, .save, .head')];
    rows.forEach((el, i) => el.animate(
      [{ transform: 'translateY(14px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 500, delay: 260 + i * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' },
    ));

    if (!cutout) {
      document.querySelector('.avatar').animate(
        [{ transform: 'scale(.5) rotate(-8deg)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: .7 }, { transform: 'none' }],
        { duration: 650, delay: 320, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' },
      );
      return;
    }

    // Персонаж сидит на краю выезжающей карточки, подпрыгивает и приземляется на своё место.
    const slot = document.querySelector('.hero-slot');
    const hero = $('hero');
    const edge = -(slot.offsetTop + slot.offsetHeight) + 10;
    const apex = edge - Math.min(innerHeight * .26, 240);
    hero.animate([
      { transform: `translateY(${edge}px)`, offset: 0 },
      { transform: `translateY(${edge}px) scale(1, 1)`, offset: .28, easing: 'cubic-bezier(.3,.7,.4,1)' },
      { transform: `translateY(${edge + 4}px) scale(1.12, .84)`, offset: .38, easing: 'cubic-bezier(.2,.6,.35,1)' },
      { transform: `translateY(${apex}px) scale(.94, 1.08) rotate(-5deg)`, offset: .62, easing: 'cubic-bezier(.55,0,.8,.3)' },
      { transform: 'translateY(0) scale(1.14, .84)', offset: .84, easing: 'cubic-bezier(.2,.9,.3,1.3)' },
      { transform: 'none', offset: 1 },
    ], { duration: 1600, fill: 'backwards' });
  }

  fetch(`c/${id}.json?t=${Date.now()}`, { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((card) => {
      const cutout = render(card);
      const media = cutout ? $('hero') : $('avatar');
      // Анимацию запускаем, когда картинка готова, иначе персонаж «прыгнет» пустым местом.
      const start = () => requestAnimationFrame(() => animateIn(cutout));
      if (media.src && !media.complete) {
        media.addEventListener('load', start, { once: true });
        media.addEventListener('error', start, { once: true });
      } else {
        start();
      }
    })
    .catch(() => {
      $('sheet').remove();
      $('missing').classList.remove('hidden');
    });
})();
</script>
</body>
</html>
