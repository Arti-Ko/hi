<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<title>Визитка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* Визитка по NFC-метке в духе портфолио разработчика: моно-заголовки, курсивные акценты, тонкие окружности. */
  :root {
    --bg: #121212;
    --text: #ececec;
    --dim: #8c8c8c;
    --faint: #5c5c5c;
    --line: #2d2d2d;
    --arc: #222222;
    --white: #f2f2f2;
    --ink: #121212;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body {
    color: var(--text); font-family: var(--sans); font-weight: 300;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  a, button { color: inherit; text-decoration: none; font: inherit; background: none; border: 0; cursor: pointer; }
  em { font-style: italic; font-weight: 400; color: #fff; }

  .page { position: relative; max-width: 460px; margin: 0 auto; padding: 0 22px calc(env(safe-area-inset-bottom) + 120px); }

  /* Тонкие окружности на фоне — как на макете, медленно плывут при прокрутке. */
  .arcs { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .arc { position: absolute; border: 1px solid var(--arc); border-radius: 50%; will-change: transform; }
  .page > :not(.arcs) { position: relative; z-index: 1; }

  /* ── Шапка ── */
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 18px) 0 0;
  }
  .handle { font-family: var(--mono); font-size: 13px; letter-spacing: .02em; color: var(--text); }
  .burger { width: 40px; height: 40px; margin-right: -8px; position: relative; }
  .burger i { position: absolute; left: 10px; right: 10px; height: 1.5px; background: var(--text); transition: transform .45s var(--ease), opacity .3s; }
  .burger i:nth-child(1) { top: 14px; } .burger i:nth-child(2) { top: 19px; } .burger i:nth-child(3) { top: 24px; }
  .menu-open .burger i:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  .menu-open .burger i:nth-child(2) { opacity: 0; }
  .menu-open .burger i:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

  /* ── Первый экран ── */
  .title { margin-top: 44px; font-family: var(--mono); font-weight: 500; font-size: clamp(30px, 9vw, 40px); line-height: 1.15; letter-spacing: -.02em; min-height: 2.3em; }
  .title .l2 { display: block; text-align: right; }
  .caret { display: inline-block; width: .55ch; height: 1em; margin-left: 2px; background: var(--text); vertical-align: -.12em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .intro { margin-top: 22px; font-size: 17px; line-height: 1.45; color: #cfcfcf; max-width: 92%; }

  .cta { display: flex; align-items: center; gap: 10px; margin-top: 26px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; padding: 0 26px; border-radius: 999px; font-size: 15px; font-style: italic; font-weight: 400;
    transition: transform .18s var(--ease), background-color .2s;
  }
  .pill.solid { background: var(--white); color: var(--ink); min-width: 150px; }
  .pill.line { border: 1px solid var(--line); color: var(--text); }
  .circle {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
    transition: transform .25s var(--ease);
  }
  .circle.solid { background: var(--white); color: var(--ink); }
  .circle.line { border: 1px solid var(--line); }
  .circle svg { width: 18px; height: 18px; transition: transform .3s var(--ease); }
  .pill:active, .circle:active { transform: scale(.94); }
  .circle:active svg { transform: rotate(-45deg); }

  .socials { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .tag {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; font-style: italic; color: #d6d6d6;
    transition: background-color .2s, transform .18s var(--ease);
  }
  .tag svg { width: 14px; height: 14px; flex: none; }
  .tag:active { transform: scale(.95); background: #1d1d1d; }

  /* Карточка с фото — как статья на макете: картинка сверху, текст на тёмном. */
  .card-photo {
    margin-top: 30px; border-radius: 28px; overflow: hidden; position: relative;
    background: #1b1b1b; border: 1px solid var(--line);
  }
  .card-photo img { width: 100%; height: 230px; object-fit: cover; display: block; }
  .card-photo .fade { position: absolute; left: 0; right: 0; top: 130px; height: 100px; background: linear-gradient(transparent, #1b1b1b); }
  .card-photo .body { position: relative; padding: 4px 18px 18px; margin-top: -40px; }
  .card-photo h3 { font-family: var(--mono); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  .card-photo p { margin-top: 6px; font-size: 13px; color: #bdbdbd; line-height: 1.4; }
  .card-photo .cta { margin-top: 16px; }
  .card-photo .pill { height: 38px; min-width: 0; padding: 0 22px; font-size: 13px; }
  .card-photo .circle { width: 38px; height: 38px; }

  /* ── Подписи разделов «… /Обо мне …» ── */
  .section { margin-top: 84px; }
  .label { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .01em; min-height: 1.2em; }
  .about { margin-top: 16px; font-size: 16px; line-height: 1.5; color: #cfcfcf; white-space: pre-line; }

  /* Навыки: первая карточка белая, остальные контурные; каждая вторая — уже, с элементом сбоку. */
  .skills { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .skill-row { display: flex; align-items: center; gap: 14px; }
  .skill { flex: 1; border-radius: 24px; padding: 18px 18px 20px; border: 1px solid var(--line); }
  .skill.solid { background: var(--white); color: var(--ink); border-color: var(--white); }
  .skill h4 { font-family: var(--sans); font-weight: 400; font-size: 15px; }
  .skill p { margin-top: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.75; }
  .skill.solid p { color: #2a2a2a; }
  .skill-row.narrow .skill { flex: 0 0 72%; }
  .side-note { font-size: 11px; line-height: 1.35; color: var(--dim); font-style: italic; }

  /* ── Контакты ── */
  .mini-nav { display: flex; gap: 18px; margin-top: 18px; font-size: 12px; color: #cfcfcf; }
  .site { display: inline-block; margin-top: 24px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 24px; }
  .site h4 { font-weight: 400; font-size: 14px; }
  .site p { margin-top: 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.8; color: #cfcfcf; }
  .big { margin-top: 30px; font-family: var(--mono); font-weight: 500; font-size: clamp(34px, 10vw, 46px); line-height: 1.1; letter-spacing: -.02em; }
  .big .n1 { display: block; }
  .big .row2 { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .big .small { font-family: var(--sans); font-weight: 300; font-size: 11px; line-height: 1.3; color: var(--dim); letter-spacing: 0; max-width: 96px; padding-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
  .grid .tag { justify-content: center; height: 36px; }

  .fine { margin-top: 40px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--faint); }

  /* ── Кнопки снизу: всегда на виду ── */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center; gap: 10px;
    padding: 34px 18px calc(env(safe-area-inset-bottom) + 16px);
    background: linear-gradient(to top, rgba(18, 18, 18, .96) 55%, rgba(18, 18, 18, 0));
  }
  [data-os="ios"] .dock {
    left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); padding: 8px; border-radius: 30px;
    background: rgba(40, 40, 40, .45); border: 1px solid rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 20px 50px -14px rgba(0, 0, 0, .7);
  }
  .dock .pill { flex: 1; max-width: 230px; height: 52px; font-size: 15px; }
  .dock .pill svg { width: 18px; height: 18px; }
  [data-os="ios"] .dock .pill.line { border-color: rgba(255, 255, 255, .22); }

  /* ── Меню ── */
  .menu {
    position: fixed; inset: 0; z-index: 4; background: rgba(18, 18, 18, .98);
    padding: calc(env(safe-area-inset-top) + 110px) 30px 0;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; visibility: hidden; transition: opacity .4s, visibility .4s;
  }
  .menu-open .menu { opacity: 1; visibility: visible; }
  .menu a { font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -.02em; padding: 6px 0; transform: translateY(14px); opacity: 0; transition: transform .5s var(--ease), opacity .4s; }
  .menu a span { color: var(--faint); font-size: 14px; margin-right: 12px; vertical-align: middle; }
  .menu-open .menu a { transform: none; opacity: 1; }
  .menu-open .bar { position: relative; z-index: 6; }

  /* Появление при прокрутке. */
  [data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease), transform .9s var(--ease); }
  [data-reveal].in { opacity: 1; transform: none; }

  .hidden { display: none !important; }
  .missing { min-height: 100dvh; display: grid; place-items: center; color: var(--dim); font-family: var(--mono); font-size: 14px; }
  :focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    [data-reveal] { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<p class="missing hidden" id="missing">... визитка не найдена ...</p>

<div id="app" class="hidden">
  <main class="page" id="top">
    <div class="arcs" aria-hidden="true">
      <i class="arc" style="width:520px;height:520px;top:-180px;right:-330px" data-speed=".06"></i>
      <i class="arc" style="width:640px;height:640px;top:820px;left:-470px" data-speed="-.05"></i>
      <i class="arc" style="width:560px;height:560px;top:1500px;right:-380px" data-speed=".04"></i>
      <i class="arc" style="width:700px;height:700px;top:2300px;left:-420px" data-speed="-.03"></i>
    </div>

    <header class="bar">
      <span class="handle" id="handle"></span>
      <button class="burger" id="burger" aria-label="Меню" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
    </header>

    <h1 class="title" id="title"></h1>
    <p class="intro" id="intro" data-reveal></p>
    <div class="cta" data-reveal>
      <a class="pill solid" id="cta">Написать</a>
      <a class="circle solid" href="#about" aria-label="Обо мне"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <div class="socials" id="socials" data-reveal></div>

    <article class="card-photo hidden" id="photoCard" data-reveal>
      <img id="photo" alt="">
      <span class="fade"></span>
      <div class="body">
        <h3 id="photoTitle"></h3>
        <p id="photoText"></p>
        <div class="cta">
          <a class="pill solid hidden" id="save">Сохранить контакт</a>
          <a class="circle solid" href="#contacts" aria-label="Контакты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </article>

    <section class="section hidden" id="about">
      <p class="label" data-type="... /Обо мне ..."></p>
      <p class="about" id="aboutText" data-reveal></p>
    </section>

    <section class="section hidden" id="skillsSection">
      <p class="label" data-type="... /Навыки ..."></p>
      <div class="skills" id="skills"></div>
    </section>

    <section class="section" id="contacts">
      <p class="label" data-type="... /Контакты ..."></p>
      <nav class="mini-nav" data-reveal>
        <a href="#top">Главная</a><a href="#about">Обо мне</a><a href="#skillsSection">Навыки</a>
      </nav>
      <div class="site" data-reveal>
        <h4>Визитка</h4>
        <p>Открыта по NFC-метке /<br>Сделана в «Описи» /<br>Живёт на GitHub Pages</p>
      </div>
      <div class="big" data-reveal>
        <span class="n1" id="bigName"></span>
        <span class="row2"><span class="small" id="bigRole"></span><span id="bigAge"></span></span>
      </div>
      <div class="grid" id="grid" data-reveal></div>
    </section>

    <p class="fine">... handcrafted with NFC ...</p>
  </main>

  <nav class="menu" id="menu" aria-label="Разделы">
    <a href="#top"><span>01</span>Главная</a>
    <a href="#about"><span>02</span>Обо мне</a>
    <a href="#skillsSection"><span>03</span>Навыки</a>
    <a href="#contacts"><span>04</span>Контакты</a>
  </nav>

  <nav class="dock hidden" id="dock" aria-label="Написать">
    <a class="pill solid hidden" id="tg" target="_blank" rel="noopener"></a>
    <a class="pill line hidden" id="ig" target="_blank" rel="noopener"></a>
  </nav>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const tokens = location.search.slice(1).split('&').filter(Boolean);
  const forced = tokens.find((t) => t === 'ios' || t === 'android');
  const id = (tokens.find((t) => t !== forced && !t.includes('=')) || 'demo').replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (!/Android/.test(navigator.userAgent) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.documentElement.dataset.os = forced || (isIOS ? 'ios' : 'android');

  const RULES = {
    media: /^m\/[a-z0-9_-]+\/[a-z0-9_.-]+(\?v=\d+)?$/i,
    telegram: /^[a-z0-9_]{4,32}$/i,
    instagram: /^[a-z0-9._]{1,30}$/i,
    phone: /^\+?[0-9 ()-]{5,20}$/,
    email: /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,24}$/,
  };
  const ICONS = {
    telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 11.3 20.4 4.5c.8-.3 1.6.3 1.4 1.4l-3 14.2c-.2 1-.9 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.4-.9.4l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L7 13.9l-4.6-1.4c-1-.3-1-1 .2-1.2z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>',
  };
  const ARROW_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

  const clean = (value, rule) => {
    const text = typeof value === 'string' || typeof value === 'number' ? String(value).trim().replace(/^@/, '') : '';
    return rule ? (rule.test(text) ? text : '') : text;
  };
  const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // *слово* в тексте визитки — курсивный акцент, как на макете.
  const rich = (s) => escape(s).replace(/\*([^*\n]{1,80})\*/g, '<em>$1</em>');
  const years = (n) => {
    const tens = n % 100;
    const ones = n % 10;
    if (tens >= 11 && tens <= 14) return 'лет';
    if (ones === 1) return 'год';
    if (ones >= 2 && ones <= 4) return 'года';
    return 'лет';
  };
  const formatPhone = (raw) => {
    const m = /^7(\d{3})(\d{3})(\d{2})(\d{2})$/.exec(raw.replace(/\D/g, '').replace(/^8(?=\d{10}$)/, '7'));
    return m ? `+7 ${m[1]} ${m[2]}-${m[3]}-${m[4]}` : raw;
  };
  const link = (cls, href, html, external) => {
    const a = document.createElement('a');
    a.className = cls;
    a.href = href;
    a.innerHTML = html;
    if (external) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  };
  const tagWithText = (icon, text, href, external) => {
    const a = link('tag', href, `${ICONS[icon]}<span></span>`, external);
    a.querySelector('span').textContent = text;
    return a;
  };

  function render(card) {
    const name = clean(card.name);
    const role = clean(card.role ?? card.subtitle);
    const age = Number.parseInt(card.age, 10);
    const hasAge = age > 0 && age < 130;
    const ageText = hasAge ? `${age} ${years(age)}` : '';
    const phone = clean(card.phone, RULES.phone);
    const email = clean(card.email, RULES.email);
    const telegram = clean(card.telegram, RULES.telegram);
    const instagram = clean(card.instagram, RULES.instagram);
    const media = clean(card.media, RULES.media);

    document.title = [name, role].filter(Boolean).join(' — ') || 'Визитка';
    $('handle').textContent = clean(card.handle) || telegram || (name ? name.toLowerCase() : 'hello');

    // Должность — заголовком в две строки, как «Full-stack / Developer».
    const words = (role || name || 'Привет').split(/\s+/);
    const cut = Math.max(1, Math.ceil(words.length / 2));
    const titleLines = [words.slice(0, cut).join(' '), words.slice(cut).join(' ')].filter(Boolean);

    const intro = clean(card.intro) || [name && `Привет! Я *${name}*`, ageText, role && role.toLowerCase()].filter(Boolean).join(', ');
    $('intro').innerHTML = rich(intro);

    const contacts = [
      telegram && ['telegram', 'Telegram', `https://t.me/${telegram}`, true],
      instagram && ['instagram', 'Instagram', `https://instagram.com/${instagram}`, true],
      phone && ['phone', formatPhone(phone), `tel:${phone.replace(/[^\d+]/g, '')}`, false],
      email && ['email', 'E-mail', `mailto:${email}`, false],
    ].filter(Boolean);
    contacts.forEach(([icon, text, href, ext]) => {
      $('socials').append(tagWithText(icon, text, href, ext));
      $('grid').append(tagWithText(icon, text, href, ext));
    });
    if (card.vcard) {
      const fileName = `${(name || 'contact').replace(/[\\/:*?"<>|]/g, '')}.vcf`;
      const save = tagWithText('save', 'В контакты', `c/${id}.vcf?v=${Number(card.updated) || 0}`, false);
      save.setAttribute('download', fileName);
      $('grid').append(save);
      $('save').href = save.href;
      $('save').setAttribute('download', fileName);
      $('save').classList.remove('hidden');
    }
    $('cta').href = telegram ? `https://t.me/${telegram}` : phone ? `tel:${phone.replace(/[^\d+]/g, '')}` : '#contacts';
    if (telegram) { $('cta').target = '_blank'; $('cta').rel = 'noopener'; }

    if (media) {
      $('photo').src = media;
      $('photoTitle').textContent = [name, hasAge ? age : ''].filter(Boolean).join(', ') || role;
      $('photoText').textContent = role;
      $('photoCard').classList.remove('hidden');
    }

    const about = clean(card.about);
    if (about) {
      $('aboutText').innerHTML = rich(about);
      $('about').classList.remove('hidden');
    }

    const skills = Array.isArray(card.skills) ? card.skills.filter((s) => s && s.title && Array.isArray(s.items)).slice(0, 8) : [];
    skills.forEach((skill, i) => {
      const box = document.createElement('div');
      box.className = `skill${i === 0 ? ' solid' : ''}`;
      box.innerHTML = '<h4></h4><p></p>';
      box.querySelector('h4').textContent = String(skill.title).slice(0, 40);
      box.querySelector('p').textContent = skill.items.map((x) => String(x).slice(0, 40)).slice(0, 12).join(' / ');
      const row = document.createElement('div');
      row.dataset.reveal = '';
      // Каждая вторая карточка уже — рядом кружок-стрелка или короткая подпись, как на макете.
      if (i % 2 === 1 && i < skills.length - 1) {
        row.className = 'skill-row narrow';
        row.append(box);
        if (i % 4 === 1) {
          const arrow = link('circle line', '#contacts', ARROW_UP, false);
          arrow.setAttribute('aria-label', 'Контакты');
          row.append(arrow);
        } else {
          const note = document.createElement('p');
          note.className = 'side-note';
          note.textContent = 'То, чем пользуюсь каждый день';
          row.append(note);
        }
      } else {
        row.className = 'skill-row';
        row.append(box);
      }
      $('skills').append(row);
    });
    if (skills.length) $('skillsSection').classList.remove('hidden');

    $('bigName').textContent = name || role;
    $('bigRole').textContent = role;
    $('bigAge').textContent = ageText;

    if (telegram) {
      $('tg').innerHTML = `${ICONS.telegram}<span>Написать в TG</span>`;
      $('tg').href = `https://t.me/${telegram}`;
      $('tg').classList.remove('hidden');
    }
    if (instagram) {
      $('ig').innerHTML = `${ICONS.instagram}<span>Instagram</span>`;
      $('ig').href = `https://instagram.com/${instagram}`;
      $('ig').classList.remove('hidden');
    }
    $('dock').classList.toggle('hidden', !telegram && !instagram);

    $('app').classList.remove('hidden');
    return titleLines;
  }

  // Заголовок печатается, как в редакторе кода, с мигающим курсором.
  function typeTitle(lines) {
    const title = $('title');
    title.setAttribute('aria-label', lines.join(' '));
    const spans = lines.map((_, i) => {
      const s = document.createElement('span');
      s.className = `l${i + 1}`;
      title.append(s);
      return s;
    });
    const caret = document.createElement('span');
    caret.className = 'caret';
    if (reduced) {
      lines.forEach((text, i) => { spans[i].textContent = text; });
      spans[spans.length - 1].append(caret);
      return;
    }
    let line = 0;
    let pos = 0;
    const step = () => {
      if (line >= lines.length) return;
      pos += 1;
      spans[line].textContent = lines[line].slice(0, pos);
      spans[line].append(caret);
      if (pos >= lines[line].length) { line += 1; pos = 0; }
      setTimeout(step, 45 + Math.random() * 55);
    };
    setTimeout(step, 250);
  }

  function typeLabel(el) {
    const text = el.dataset.type;
    if (reduced) { el.textContent = text; return; }
    let pos = 0;
    const step = () => {
      pos += 1;
      el.textContent = text.slice(0, pos);
      if (pos < text.length) setTimeout(step, 28);
    };
    step();
  }

  function observe() {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        if (e.target.dataset.type) typeLabel(e.target); else e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { threshold: 0.12 });
    let first = 0;
    document.querySelectorAll('[data-reveal], [data-type]').forEach((el) => {
      if (el.closest('.hidden')) return;
      // То, что видно сразу, появляется по очереди после печати заголовка.
      el.style.transitionDelay = el.getBoundingClientRect().top < innerHeight ? `${700 + first++ * 110}ms` : '0ms';
      io.observe(el);
    });

    // Окружности плывут медленнее текста — получается глубина.
    const arcs = [...document.querySelectorAll('.arc')];
    let ticking = false;
    addEventListener('scroll', () => {
      if (ticking || reduced) return;
      ticking = true;
      requestAnimationFrame(() => {
        arcs.forEach((a) => { a.style.transform = `translateY(${(scrollY * Number(a.dataset.speed)).toFixed(1)}px)`; });
        ticking = false;
      });
    }, { passive: true });
  }

  function bindMenu() {
    const set = (open) => {
      $('app').classList.toggle('menu-open', open);
      $('burger').setAttribute('aria-expanded', String(open));
      [...$('menu').children].forEach((a, i) => { a.style.transitionDelay = open ? `${120 + i * 70}ms` : '0ms'; });
    };
    $('burger').addEventListener('click', () => set(!$('app').classList.contains('menu-open')));
    $('menu').addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('.pill, .circle, .tag') && navigator.vibrate) navigator.vibrate(8);
  });

  // Основное пишет «Опись», навыки и прочее — необязательный c/<id>.extra.json.
  const get = (path) => fetch(`${path}?t=${Date.now()}`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null));
  Promise.all([get(`c/${id}.json`), get(`c/${id}.extra.json`).catch(() => null)])
    .then(([card, extra]) => {
      if (!card) throw new Error('not found');
      const lines = render({ ...(extra || {}), ...card });
      bindMenu();
      typeTitle(lines);
      observe();
    })
    .catch(() => $('missing').classList.remove('hidden'));
})();
</script>
</body>
</html>
