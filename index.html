<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<title>Привет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифты не блокируют страницу: на плохой связи она сразу видна системным шрифтом, фирменный подменится позже. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"></noscript>
<style>
  /* Карточка знакомства по NFC-метке: поднёс телефон — увидел, кто это, и сразу можешь написать. */
  :root {
    --bg: #121212;
    --text: #ececec;
    --dim: #8c8c8c;
    --faint: #5c5c5c;
    --line: #2d2d2d;
    --arc: #232323;
    --white: #f2f2f2;
    --ink: #121212;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100dvh; color: var(--text); font-family: var(--sans); font-weight: 300;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  em { font-style: italic; font-weight: 400; color: #fff; }

  .arcs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .arc { position: absolute; border: 1px solid var(--arc); border-radius: 50%; }
  .arc.a1 { width: 560px; height: 560px; top: -230px; right: -360px; animation: drift 24s ease-in-out infinite alternate; }
  .arc.a2 { width: 680px; height: 680px; bottom: -420px; left: -470px; animation: drift 30s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(-30px, 24px) rotate(8deg); } }

  .card {
    position: relative; max-width: 440px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 156px);
  }
  .label { font-family: var(--mono); font-size: 13px; font-weight: 500; min-height: 1.2em; }

  /* Фото — главное: наклоняется за пальцем и наклоном телефона, по нему бежит блик. */
  .photo {
    position: relative; margin-top: 18px; border-radius: 30px; overflow: hidden;
    aspect-ratio: 4 / 5; max-height: 58dvh; width: 100%;
    background: #1c1c1c; box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .9);
    transform-style: preserve-3d; will-change: transform;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.06); }
  .photo .glare {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 20%), rgba(255, 255, 255, .55), transparent 55%);
  }
  .photo .shade { position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(transparent, rgba(10, 10, 10, .88)); }
  .caption { position: absolute; left: 20px; right: 20px; bottom: 18px; }
  .name { font-family: var(--mono); font-weight: 600; font-size: clamp(30px, 9vw, 40px); letter-spacing: -.02em; line-height: 1.05; min-height: 1.05em; }
  .caret { display: inline-block; width: .5ch; height: .95em; margin-left: 3px; background: var(--text); vertical-align: -.1em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .role { margin-top: 6px; font-size: 15px; color: #d0d0d0; font-style: italic; }
  /* Без фото — большое имя на окружностях. */
  .photo.empty { aspect-ratio: auto; height: 46dvh; background: transparent; box-shadow: none; border: 1px solid var(--line); }
  .photo.empty .shade, .photo.empty .glare { display: none; }

  .tagline { margin-top: 22px; font-size: 18px; line-height: 1.45; color: #d4d4d4; }
  .likes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip {
    display: inline-flex; align-items: center; height: 34px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono); font-size: 12.5px; color: #dcdcdc;
  }
  .minor { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tag {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-style: italic; color: #d6d6d6;
    transition: transform .18s var(--ease), background-color .2s;
  }
  .tag svg { width: 15px; height: 15px; flex: none; }
  .tag:active { transform: scale(.95); background: #1d1d1d; }

  /* Написать — всегда под пальцем. */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 30px 20px calc(env(safe-area-inset-bottom) + 16px);
    background: linear-gradient(to top, rgba(18, 18, 18, .97) 62%, rgba(18, 18, 18, 0));
  }
  [data-os="ios"] .dock {
    left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); padding: 8px; border-radius: 32px;
    background: rgba(40, 40, 40, .5); border: 1px solid rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 20px 50px -14px rgba(0, 0, 0, .7);
  }
  .dock .row { display: flex; gap: 8px; width: 100%; max-width: 420px; }
  .btn {
    flex: 1; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 16px; font-style: italic; font-weight: 400; transition: transform .18s var(--ease);
  }
  .btn svg { width: 19px; height: 19px; flex: none; }
  .btn.solid { background: var(--white); color: var(--ink); }
  .btn.line { border: 1px solid var(--line); }
  [data-os="ios"] .btn.line { border-color: rgba(255, 255, 255, .22); }
  .btn:active { transform: scale(.96); }

  /* Появление по очереди. */
  .in-1, .in-2, .in-3 { opacity: 0; transform: translateY(18px); animation: rise .8s var(--ease) forwards; }
  .in-1 { animation-delay: 1.1s; } .in-2 { animation-delay: 1.25s; } .in-3 { animation-delay: 1.4s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .photo.reveal { animation: unveil 1.1s var(--ease) .15s both; }
  .photo.reveal img { animation: settle 1.6s var(--ease) .15s both; }
  @keyframes unveil { from { clip-path: inset(100% 0 0 0 round 30px); } to { clip-path: inset(0 0 0 0 round 30px); } }
  @keyframes settle { from { transform: scale(1.3); } to { transform: scale(1.06); } }
  .dock.rise { animation: dock .9s cubic-bezier(.34, 1.3, .64, 1) .8s both; }
  @keyframes dock { from { transform: translateY(120%); } to { transform: none; } }

  .hidden { display: none !important; }
  .missing { min-height: 100dvh; display: grid; place-items: center; color: var(--dim); font-family: var(--mono); font-size: 14px; }
  :focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .in-1, .in-2, .in-3 { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="arcs" aria-hidden="true"><i class="arc a1"></i><i class="arc a2"></i></div>
<p class="missing hidden" id="missing">... визитка не найдена ...</p>

<main class="card hidden" id="card">
  <p class="label" id="label"></p>
  <figure class="photo reveal" id="photo">
    <img id="img" alt="">
    <span class="shade"></span>
    <span class="glare"></span>
    <figcaption class="caption">
      <h1 class="name" id="name"></h1>
      <p class="role" id="role"></p>
    </figcaption>
  </figure>
  <p class="tagline in-1" id="line"></p>
  <div class="likes in-2" id="likes"></div>
  <div class="minor in-3" id="minor"></div>
</main>

<nav class="dock rise hidden" id="dock" aria-label="Написать">
  <div class="row">
    <a class="btn solid hidden" id="tg" target="_blank" rel="noopener"></a>
    <a class="btn line hidden" id="ig" target="_blank" rel="noopener"></a>
  </div>
</nav>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const tokens = location.search.slice(1).split('&').filter(Boolean);
  const forced = tokens.find((t) => t === 'ios' || t === 'android');
  const id = (tokens.find((t) => t !== forced && !t.includes('=')) || 'demo').replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (!/Android/.test(navigator.userAgent) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.documentElement.dataset.os = forced || (isIOS ? 'ios' : 'android');

  const RULES = {
    media: /^m\/[a-z0-9_-]+\/[a-z0-9_.-]+(\?v=\d+)?$/i,
    telegram: /^[a-z0-9_]{4,32}$/i,
    instagram: /^[a-z0-9._]{1,30}$/i,
    phone: /^\+?[0-9 ()-]{5,20}$/,
    email: /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,24}$/,
  };
  const ICONS = {
    telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 11.3 20.4 4.5c.8-.3 1.6.3 1.4 1.4l-3 14.2c-.2 1-.9 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.4-.9.4l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L7 13.9l-4.6-1.4c-1-.3-1-1 .2-1.2z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>',
  };

  const clean = (value, rule) => {
    const text = typeof value === 'string' || typeof value === 'number' ? String(value).trim().replace(/^@/, '') : '';
    return rule ? (rule.test(text) ? text : '') : text;
  };
  const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // *слово* — курсивный акцент.
  const rich = (s) => escape(s).replace(/\*([^*\n]{1,80})\*/g, '<em>$1</em>');
  const tag = (icon, text, href, external) => {
    const a = document.createElement('a');
    a.className = 'tag';
    a.href = href;
    a.innerHTML = `${ICONS[icon]}<span></span>`;
    a.querySelector('span').textContent = text;
    if (external) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  };

  function render(card) {
    const name = clean(card.name) || 'Привет';
    const age = Number.parseInt(card.age, 10);
    const role = clean(card.role ?? card.subtitle);
    const phone = clean(card.phone, RULES.phone);
    const email = clean(card.email, RULES.email);
    const telegram = clean(card.telegram, RULES.telegram);
    const instagram = clean(card.instagram, RULES.instagram);
    const media = clean(card.media, RULES.media);
    const nameLine = age > 0 && age < 130 ? `${name}, ${age}` : name;

    document.title = nameLine;
    $('label').dataset.type = clean(card.label) || '... /давай знакомиться ...';
    $('role').textContent = role;
    $('line').innerHTML = rich(clean(card.line) || 'Раз ты это читаешь — *метка сработала*. Напиши мне, давай знакомиться.');

    if (media) {
      $('img').src = media;
    } else {
      $('img').remove();
      $('photo').classList.add('empty');
    }

    const likes = Array.isArray(card.likes) ? card.likes.map((x) => clean(x)).filter(Boolean).slice(0, 10) : [];
    likes.forEach((text) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = text.slice(0, 32);
      $('likes').append(chip);
    });
    if (!likes.length) $('likes').remove();

    if (phone) $('minor').append(tag('phone', 'Позвонить', `tel:${phone.replace(/[^\d+]/g, '')}`, false));
    if (email) $('minor').append(tag('email', 'Почта', `mailto:${email}`, false));
    if (card.vcard) {
      const save = tag('save', 'В контакты', `c/${id}.vcf?v=${Number(card.updated) || 0}`, false);
      save.setAttribute('download', `${name.replace(/[\\/:*?"<>|]/g, '')}.vcf`);
      $('minor').append(save);
    }

    if (telegram) {
      $('tg').innerHTML = `${ICONS.telegram}<span>Написать в Telegram</span>`;
      $('tg').href = `https://t.me/${telegram}`;
      $('tg').classList.remove('hidden');
    }
    if (instagram) {
      $('ig').innerHTML = `${ICONS.instagram}<span>Instagram</span>`;
      $('ig').href = `https://instagram.com/${instagram}`;
      $('ig').classList.remove('hidden');
    }
    // Одна кнопка — пусть будет во всю ширину и с понятной подписью.
    if (telegram && instagram) $('tg').querySelector('span').textContent = 'Telegram';
    $('dock').classList.toggle('hidden', !telegram && !instagram);

    $('card').classList.remove('hidden');
    return nameLine;
  }

  function type(el, text, delay, speed, caret) {
    if (reduced) { el.textContent = text; if (caret) el.append(caret); return; }
    let pos = 0;
    const step = () => {
      pos += 1;
      el.textContent = text.slice(0, pos);
      if (caret) el.append(caret);
      if (pos < text.length) setTimeout(step, speed + Math.random() * speed);
    };
    setTimeout(step, delay);
  }

  // Фото наклоняется вслед за пальцем или наклоном телефона — карточка будто в руках.
  function tilt() {
    if (reduced) return;
    const photo = $('photo');
    const target = { x: 0, y: 0 };
    const now = { x: 0, y: 0 };
    let base = null;
    let lastTouch = 0;
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    addEventListener('pointermove', (e) => {
      const r = photo.getBoundingClientRect();
      target.x = clamp(((e.clientX - r.left) / r.width) * 2 - 1);
      target.y = clamp(((e.clientY - r.top) / r.height) * 2 - 1);
      lastTouch = performance.now();
    }, { passive: true });
    addEventListener('pointerup', () => { target.x = 0; target.y = 0; }, { passive: true });
    const onTilt = (e) => {
      if (e.gamma == null || e.beta == null || performance.now() - lastTouch < 1500) return;
      if (!base) base = { b: e.beta, g: e.gamma };
      target.x = clamp((e.gamma - base.g) / 25);
      target.y = clamp((e.beta - base.b) / 25);
    };
    // iPhone спрашивает разрешение на датчики только по касанию.
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      addEventListener('touchend', () => {
        DeviceOrientationEvent.requestPermission().then((s) => { if (s === 'granted') addEventListener('deviceorientation', onTilt); }).catch(() => {});
      }, { once: true });
    } else {
      addEventListener('deviceorientation', onTilt);
    }
    const frame = () => {
      now.x += (target.x - now.x) * 0.08;
      now.y += (target.y - now.y) * 0.08;
      photo.style.transform = `perspective(1000px) rotateY(${(now.x * 7).toFixed(2)}deg) rotateX(${(-now.y * 7).toFixed(2)}deg)`;
      photo.style.setProperty('--gx', `${(50 + now.x * 45).toFixed(1)}%`);
      photo.style.setProperty('--gy', `${(25 + now.y * 45).toFixed(1)}%`);
      requestAnimationFrame(frame);
    };
    // Наклон включаем после появления фото, чтобы не мешать анимации.
    setTimeout(() => requestAnimationFrame(frame), 1300);
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('.btn, .tag') && navigator.vibrate) navigator.vibrate(8);
  });

  const get = (path) => fetch(`${path}?t=${Date.now()}`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null));
  Promise.all([get(`c/${id}.json`), get(`c/${id}.extra.json`).catch(() => null)])
    .then(([card, extra]) => {
      if (!card) throw new Error('not found');
      const nameLine = render({ ...(extra || {}), ...card });
      const caret = document.createElement('span');
      caret.className = 'caret';
      type($('label'), $('label').dataset.type, 0, 22);
      type($('name'), nameLine, 650, 55, caret);
      tilt();
    })
    .catch(() => $('missing').classList.remove('hidden'));
})();
</script>
</body>
</html>
