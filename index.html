<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<title>Привет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифты не блокируют страницу: на плохой связи она сразу видна системным шрифтом, фирменный подменится позже. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"></noscript>
<style>
  /* Карточка знакомства по NFC-метке: фото первым, имя, пара живых деталей и кнопки мессенджеров под пальцем. */
  :root {
    --bg: #111111;
    --surface: #1a1a1a;
    --text: #efefef;
    --soft: #cfcfcf;
    --dim: #8a8a8a;
    --line: #2c2c2c;
    --arc: #222222;
    --white: #f3f3f3;
    --ink: #111111;
    --live: #3ddc84;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.34, 1.4, .64, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100dvh; color: var(--text); font-family: var(--sans); font-weight: 300;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  em { font-style: italic; font-weight: 400; color: #fff; }

  .arcs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .arc { position: absolute; border: 1px solid var(--arc); border-radius: 50%; }
  .arc.a1 { width: 620px; height: 620px; top: 38dvh; right: -440px; animation: drift 26s ease-in-out infinite alternate; }
  .arc.a2 { width: 720px; height: 720px; bottom: -520px; left: -480px; animation: drift 32s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(-30px, 24px) rotate(8deg); } }

  /* Низ карточки — ровно над кнопками (высоту кнопок меряет скрипт), чтобы не было лишнего скролла. */
  .card { position: relative; max-width: 480px; margin: 0 auto; padding-bottom: calc(var(--dock-h, 150px) + 12px); }

  /* ── Фото на всю ширину: первым делом смотрят на него ── */
  .hero {
    position: relative; height: min(66dvh, 600px); overflow: hidden;
    border-radius: 0 0 36px 36px; background: var(--surface);
    transform-origin: 50% 0; will-change: transform;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; animation: breathe 14s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(1.06); } to { transform: scale(1.14) translateY(-1.5%); } }
  .hero .glare {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 25%), rgba(255, 255, 255, .5), transparent 55%);
  }
  .hero .top-shade { position: absolute; inset: 0 0 auto 0; height: 26%; background: linear-gradient(rgba(0, 0, 0, .45), transparent); }
  .hero .shade { position: absolute; inset: auto 0 0 0; height: 58%; background: linear-gradient(transparent, rgba(8, 8, 8, .92)); }
  .hero.empty { height: 44dvh; background: radial-gradient(circle at 70% 20%, #262626, var(--bg) 70%); }

  .topline {
    position: absolute; top: calc(env(safe-area-inset-top) + 16px); left: 18px; right: 18px;
    display: flex; justify-content: space-between; align-items: center; z-index: 2;
  }
  .label { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, .85); min-height: 1.2em; }
  .near {
    display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
    background: rgba(0, 0, 0, .38); border: 1px solid rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 12px; font-weight: 400; color: #f2f2f2;
  }
  .near i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(61, 220, 132, .6); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(61, 220, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); } }

  .caption { position: absolute; left: 22px; right: 22px; bottom: 22px; z-index: 2; }
  .name { font-family: var(--mono); font-weight: 600; font-size: clamp(34px, 10.5vw, 46px); letter-spacing: -.025em; line-height: 1.02; min-height: 1.02em; }
  .caret { display: inline-block; width: .5ch; height: .95em; margin-left: 3px; background: var(--text); vertical-align: -.1em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .role { margin-top: 8px; font-size: 15px; color: #dadada; font-style: italic; }

  /* Сердечко на двойной тап — как лайк в приложениях знакомств. */
  .heart { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; z-index: 3; color: #fff; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .4)); }

  /* ── Под фото ── */
  .content { position: relative; padding: 0 20px; }
  .tagline { margin-top: 24px; font-size: 19px; line-height: 1.42; color: var(--soft); letter-spacing: -.005em; }

  .prompts { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .prompt { border: 1px solid var(--line); border-radius: 24px; padding: 16px 18px 18px; background: rgba(26, 26, 26, .6); }
  .prompt .q { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .prompt .a { margin-top: 8px; font-size: 18px; line-height: 1.35; font-weight: 400; color: var(--text); }
  .prompt:first-child { background: var(--white); border-color: var(--white); }
  .prompt:first-child .q { color: #6b6b6b; }
  .prompt:first-child .a { color: var(--ink); }
  .prompt:first-child em { color: var(--ink); }
  /* Сердечко на подсказке — ответить именно на неё (как лайк с комментарием в Hinge). */
  .prompt { position: relative; }
  .prompt .a { padding-right: 46px; }
  .prompt .like {
    position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid var(--line); background: rgba(17, 17, 17, .6); color: #fff;
    transition: transform .2s var(--spring);
  }
  .prompt:first-child .like { border-color: #d9d9d9; background: #fff; color: var(--ink); }
  .prompt .like svg { width: 18px; height: 18px; }
  .prompt .like:active { transform: scale(.85); }

  /* Несколько фото — полоски сверху и тап по краю, как в Stories у Tinder. */
  .bars { position: absolute; top: calc(env(safe-area-inset-top) + 8px); left: 12px; right: 12px; display: flex; gap: 4px; z-index: 3; }
  .bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .3); transition: background-color .3s; }
  .bars i.on { background: #fff; }
  .hero.multi .topline { top: calc(env(safe-area-inset-top) + 22px); }
  .hero img.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .35s var(--ease); }
  .hero img.slide.on { opacity: 1; }

  /* Короткие факты значками под именем (vitals в Hinge). */
  .vitals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .vital {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px;
    background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 12.5px; color: #f0f0f0;
  }
  .vital svg { width: 13px; height: 13px; flex: none; }

  /* «Начни с одного тапа» — готовые первые сообщения (Opening Moves в Bumble): тап — и чат уже с текстом. */
  .moves { margin-top: 22px; }
  .moves-label { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .moves-row { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; margin-top: 10px; }
  .bubble {
    position: relative; max-width: 90%; padding: 10px 40px 10px 14px; border-radius: 20px 20px 20px 6px;
    background: #202020; border: 1px solid var(--line); font-size: 15px; line-height: 1.3; color: var(--text);
    transition: transform .18s var(--ease), background-color .2s;
  }
  .bubble .txt { opacity: 0; transition: opacity .35s; }
  .bubble .send { position: absolute; right: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; opacity: 0; color: #37bbfe; transition: opacity .35s; }
  .bubble .dots { position: absolute; left: 14px; top: 50%; margin-top: -3px; display: flex; gap: 4px; transition: opacity .25s; }
  .bubble .dots i { width: 6px; height: 6px; border-radius: 50%; background: #8a8a8a; animation: dot 1s infinite; }
  .bubble .dots i:nth-child(2) { animation-delay: .15s; } .bubble .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  .bubble.shown .txt, .bubble.shown .send { opacity: 1; }
  .bubble.shown .dots { opacity: 0; }
  .bubble:active { transform: scale(.97); background: #262626; }

  .likes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .chip {
    display: inline-flex; align-items: center; height: 36px; padding: 0 15px;
    border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono); font-size: 12.5px; color: #dedede;
  }
  .minor { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 15px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 13.5px; font-style: italic; color: #dadada;
    transition: transform .18s var(--ease), background-color .2s;
  }
  .tag svg { width: 15px; height: 15px; flex: none; }
  .tag:active { transform: scale(.95); background: #1d1d1d; }

  /* ── Кнопки мессенджеров: всегда под большим пальцем ── */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 34px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(to top, rgba(17, 17, 17, .97) 64%, rgba(17, 17, 17, 0));
  }
  [data-os="ios"] .dock {
    left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); padding: 8px; border-radius: 34px;
    background: rgba(38, 38, 38, .5); border: 1px solid rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 24px 60px -16px rgba(0, 0, 0, .75);
  }
  .dock .row { display: flex; gap: 8px; width: 100%; max-width: 448px; }
  .btn {
    position: relative; overflow: hidden; flex: 1; height: 56px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 16px; font-weight: 400; font-style: italic; letter-spacing: -.005em;
    transition: transform .18s var(--ease);
  }
  .btn.solid { background: var(--white); color: var(--ink); height: 58px; font-size: 17px; }
  .btn.line { border: 1px solid var(--line); background: rgba(26, 26, 26, .7); }
  [data-os="ios"] .btn.line { border-color: rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .04); }
  .btn:active { transform: scale(.965); }
  .btn .ripple { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: .18; pointer-events: none; animation: ripple .6s var(--ease); }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  /* Фирменные значки: узнаются раньше, чем прочитается подпись. */
  .badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }
  .badge svg { width: 15px; height: 15px; }
  .badge.tg { background: linear-gradient(160deg, #37bbfe, #007dbb); }
  .badge.max { border-radius: 8px; background: linear-gradient(135deg, #1f6bff, #7a3cff 60%, #c13cff); }
  .badge.ig { border-radius: 8px; background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }

  /* Появление по очереди. */
  .rise { opacity: 0; transform: translateY(18px); animation: rise .8s var(--ease) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .hero.reveal { animation: unveil 1.1s var(--ease) .1s both; }
  @keyframes unveil { from { clip-path: inset(0 0 100% 0 round 0 0 36px 36px); } to { clip-path: inset(0 0 0 0 round 0 0 36px 36px); } }
  .dock.in { animation: dock .9s var(--spring) .75s both; }
  @keyframes dock { from { transform: translateY(130%); } to { transform: none; } }

  .hidden { display: none !important; }
  .missing { min-height: 100dvh; display: grid; place-items: center; color: var(--dim); font-family: var(--mono); font-size: 14px; }
  :focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rise { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="arcs" aria-hidden="true"><i class="arc a1"></i><i class="arc a2"></i></div>
<p class="missing hidden" id="missing">... визитка не найдена ...</p>

<main class="card hidden" id="card">
  <figure class="hero reveal" id="hero">
    <img id="img" alt="">
    <span class="top-shade"></span>
    <span class="shade"></span>
    <span class="glare"></span>
    <div class="bars hidden" id="bars"></div>
    <div class="topline">
      <span class="label" id="label"></span>
      <span class="near" id="near"><i></i><span id="nearText"></span></span>
    </div>
    <figcaption class="caption">
      <h1 class="name" id="name"></h1>
      <div class="vitals" id="vitals"></div>
    </figcaption>
  </figure>

  <div class="content">
    <p class="tagline rise" id="line" style="animation-delay:1.05s"></p>
    <section class="moves hidden rise" id="moves" style="animation-delay:1.15s">
      <p class="moves-label">... /начни с одного тапа ...</p>
      <div class="moves-row" id="movesRow"></div>
    </section>
    <div class="prompts" id="prompts"></div>
    <div class="likes rise" id="likes" style="animation-delay:1.35s"></div>
    <div class="minor rise" id="minor" style="animation-delay:1.45s"></div>
  </div>
</main>

<nav class="dock in hidden" id="dock" aria-label="Написать"></nav>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const tokens = location.search.slice(1).split('&').filter(Boolean);
  const forced = tokens.find((t) => t === 'ios' || t === 'android');
  const id = (tokens.find((t) => t !== forced && !t.includes('=')) || 'demo').replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (!/Android/.test(navigator.userAgent) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.documentElement.dataset.os = forced || (isIOS ? 'ios' : 'android');

  const RULES = {
    media: /^m\/[a-z0-9_-]+\/[a-z0-9_.-]+(\?v=\d+)?$/i,
    telegram: /^[a-z0-9_]{4,32}$/i,
    instagram: /^[a-z0-9._]{1,30}$/i,
    max: /^https:\/\/(www\.)?max\.ru\/[A-Za-z0-9_\-/]{2,80}$/,
    phone: /^\+?[0-9 ()-]{5,20}$/,
    email: /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,24}$/,
  };
  const ICONS = {
    telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 11.3 20.4 4.5c.8-.3 1.6.3 1.4 1.4l-3 14.2c-.2 1-.9 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.4-.9.4l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L7 13.9l-4.6-1.4c-1-.3-1-1 .2-1.2z"/></svg>',
    max: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-4.9 0-8.5 3.4-8.5 7.9 0 2.4 1 4.4 2.8 5.8l-.6 3.3 3.5-1.7c.9.3 1.8.4 2.8.4 4.9 0 8.5-3.4 8.5-7.8S16.9 3.5 12 3.5z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>',
    save: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>',
    work: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 3h4a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm4 4V5h-4v2h4z"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.3 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.3z"/></svg>',
  };

  const clean = (value, rule) => {
    const text = typeof value === 'string' || typeof value === 'number' ? String(value).trim() : '';
    const bare = rule && rule !== RULES.max ? text.replace(/^@/, '') : text;
    return rule ? (rule.test(bare) ? bare : '') : bare;
  };
  const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rich = (s) => escape(s).replace(/\*([^*\n]{1,80})\*/g, '<em>$1</em>');
  const tag = (icon, text, href) => {
    const a = document.createElement('a');
    a.className = 'tag';
    a.href = href;
    a.innerHTML = `${ICONS[icon]}<span></span>`;
    a.querySelector('span').textContent = text;
    return a;
  };
  const button = (kind, style, label, href) => {
    const a = document.createElement('a');
    a.className = `btn ${style}`;
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `<span class="badge ${kind}">${ICONS[kind === 'tg' ? 'telegram' : kind === 'ig' ? 'instagram' : 'max']}</span><span></span>`;
    a.lastChild.textContent = label;
    return a;
  };

  const DEFAULT_MOVES = ['Привет! Это я — с метки 👋', 'Пойдём за кофе? ☕', 'Как работает эта метка? 🙂'];

  // Несколько фото: полоски сверху, тап по правой части — дальше, по левой — назад.
  function setupSlides(photos) {
    const hero = $('hero');
    hero.classList.add('multi');
    $('img').remove();
    const imgs = photos.map((src, i) => {
      const img = document.createElement('img');
      img.className = `slide${i === 0 ? ' on' : ''}`;
      img.src = src;
      img.alt = '';
      hero.prepend(img);
      return img;
    });
    const bars = photos.map((_, i) => {
      const bar = document.createElement('i');
      if (i === 0) bar.className = 'on';
      $('bars').append(bar);
      return bar;
    });
    $('bars').classList.remove('hidden');
    let current = 0;
    hero.dataset.slides = 'on';
    hero.addEventListener('slide', (e) => {
      current = (current + e.detail + photos.length) % photos.length;
      imgs.forEach((img, i) => img.classList.toggle('on', i === current));
      bars.forEach((bar, i) => bar.classList.toggle('on', i <= current));
    });
  }

  function render(card) {
    const name = clean(card.name) || 'Привет';
    const age = Number.parseInt(card.age, 10);
    const role = clean(card.role ?? card.subtitle);
    const phone = clean(card.phone, RULES.phone);
    const email = clean(card.email, RULES.email);
    const telegram = clean(card.telegram, RULES.telegram);
    const instagram = clean(card.instagram, RULES.instagram);
    const max = clean(card.max, RULES.max);
    const media = clean(card.media, RULES.media);
    const nameLine = age > 0 && age < 130 ? `${name}, ${age}` : name;

    document.title = nameLine;
    $('label').dataset.type = clean(card.label) || '... /давай знакомиться ...';
    // Это правда всегда: метку только что поднесли — значит, человек рядом.
    $('nearText').textContent = clean(card.status) || 'рядом с тобой';
    const vital = (icon, text) => {
      const v = document.createElement('span');
      v.className = 'vital';
      v.innerHTML = `${ICONS[icon]}<span></span>`;
      v.lastChild.textContent = text;
      $('vitals').append(v);
    };
    if (role) vital('work', role);
    if (clean(card.city)) vital('pin', clean(card.city).slice(0, 30));
    const write = (text) => (telegram ? `https://t.me/${telegram}?text=${encodeURIComponent(text)}` : '');
    $('line').innerHTML = rich(clean(card.line) || 'Раз ты это читаешь — *метка сработала*. Напиши мне, давай знакомиться.');

    const photos = [media, ...(Array.isArray(card.photos) ? card.photos : [])].map((x) => clean(x, RULES.media)).filter(Boolean).slice(0, 6);
    if (photos.length) $('img').src = photos[0]; else { $('img').remove(); $('hero').classList.add('empty'); }
    if (photos.length > 1) setupSlides(photos);

    // Готовые первые сообщения: тап — и в Telegram уже вписан текст, остаётся нажать «Отправить».
    const moves = (Array.isArray(card.moves) ? card.moves : DEFAULT_MOVES).map((x) => clean(x)).filter(Boolean).slice(0, 3);
    if (telegram && moves.length) {
      moves.forEach((text) => {
        const a = document.createElement('a');
        a.className = 'bubble';
        a.href = write(text);
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = `<span class="txt"></span><span class="dots"><i></i><i></i><i></i></span>${ICONS.send.replace('<svg', '<svg class="send"')}`;
        a.querySelector('.txt').textContent = text.slice(0, 80);
        $('movesRow').append(a);
      });
      $('moves').classList.remove('hidden');
    }

    const prompts = Array.isArray(card.prompts) ? card.prompts.filter((p) => p && clean(p.q) && clean(p.a)).slice(0, 3) : [];
    prompts.forEach((p, i) => {
      const box = document.createElement('div');
      box.className = 'prompt rise';
      box.style.animationDelay = `${1.15 + i * 0.1}s`;
      box.innerHTML = '<p class="q"></p><p class="a"></p>';
      box.querySelector('.q').textContent = clean(p.q).slice(0, 60);
      box.querySelector('.a').innerHTML = rich(clean(p.a).slice(0, 140));
      if (telegram) {
        const like = document.createElement('a');
        like.className = 'like';
        like.href = write(`Про «${clean(p.q).slice(0, 60)}» — `);
        like.target = '_blank';
        like.rel = 'noopener';
        like.setAttribute('aria-label', 'Ответить на это');
        like.innerHTML = ICONS.heart;
        box.append(like);
      }
      $('prompts').append(box);
    });

    const likes = Array.isArray(card.likes) ? card.likes.map((x) => clean(x)).filter(Boolean).slice(0, 10) : [];
    likes.forEach((text) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = text.slice(0, 32);
      $('likes').append(chip);
    });

    if (phone) $('minor').append(tag('phone', 'Позвонить', `tel:${phone.replace(/[^\d+]/g, '')}`));
    if (email) $('minor').append(tag('email', 'Почта', `mailto:${email}`));
    if (card.vcard) {
      const save = tag('save', 'В контакты', `c/${id}.vcf?v=${Number(card.updated) || 0}`);
      save.setAttribute('download', `${name.replace(/[\\/:*?"<>|]/g, '')}.vcf`);
      $('minor').append(save);
    }

    // Главный мессенджер — крупно сверху, остальные рядом ниже.
    const messengers = [
      telegram && ['tg', `https://t.me/${telegram}`],
      max && ['max', max],
      instagram && ['ig', `https://instagram.com/${instagram}`],
    ].filter(Boolean);
    const LABELS = { tg: 'Telegram', max: 'MAX', ig: 'Instagram' };
    if (messengers.length) {
      const [first, ...rest] = messengers;
      const top = document.createElement('div');
      top.className = 'row';
      top.append(button(first[0], 'solid', `Написать в ${LABELS[first[0]]}`, first[1]));
      $('dock').append(top);
      if (rest.length) {
        const bottom = document.createElement('div');
        bottom.className = 'row';
        rest.forEach(([kind, href]) => bottom.append(button(kind, 'line', LABELS[kind], href)));
        $('dock').append(bottom);
      }
      $('dock').classList.remove('hidden');
    }

    $('card').classList.remove('hidden');
    return nameLine;
  }

  function type(el, text, delay, speed, caret) {
    if (reduced) { el.textContent = text; if (caret) el.append(caret); return; }
    let pos = 0;
    const step = () => {
      pos += 1;
      el.textContent = text.slice(0, pos);
      if (caret) el.append(caret);
      if (pos < text.length) setTimeout(step, speed + Math.random() * speed);
    };
    setTimeout(step, delay);
  }

  // Фото слегка поворачивается вслед за пальцем и наклоном телефона, по нему бежит блик.
  function tilt() {
    if (reduced) return;
    const hero = $('hero');
    const target = { x: 0, y: 0 };
    const now = { x: 0, y: 0 };
    let base = null;
    let lastTouch = 0;
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    addEventListener('pointermove', (e) => {
      target.x = clamp((e.clientX / innerWidth) * 2 - 1);
      target.y = clamp((e.clientY / innerHeight) * 2 - 1);
      lastTouch = performance.now();
    }, { passive: true });
    addEventListener('pointerup', () => { target.x = 0; target.y = 0; }, { passive: true });
    const onTilt = (e) => {
      if (e.gamma == null || e.beta == null || performance.now() - lastTouch < 1500) return;
      if (!base) base = { b: e.beta, g: e.gamma };
      target.x = clamp((e.gamma - base.g) / 25);
      target.y = clamp((e.beta - base.b) / 25);
    };
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      addEventListener('touchend', () => {
        DeviceOrientationEvent.requestPermission().then((s) => { if (s === 'granted') addEventListener('deviceorientation', onTilt); }).catch(() => {});
      }, { once: true });
    } else {
      addEventListener('deviceorientation', onTilt);
    }
    const frame = () => {
      now.x += (target.x - now.x) * 0.08;
      now.y += (target.y - now.y) * 0.08;
      hero.style.transform = `perspective(1200px) rotateY(${(now.x * 4).toFixed(2)}deg) rotateX(${(-now.y * 3).toFixed(2)}deg)`;
      hero.style.setProperty('--gx', `${(50 + now.x * 45).toFixed(1)}%`);
      hero.style.setProperty('--gy', `${(25 + now.y * 40).toFixed(1)}%`);
      requestAnimationFrame(frame);
    };
    setTimeout(() => requestAnimationFrame(frame), 1300);
  }

  // Фото занимает всё, что осталось от экрана после текста и кнопок: влезает ровно, без микроскролла.
  // Если текста много, фото не меньше 300 px — тогда прокрутка уже по делу.
  function fitToScreen() {
    const fit = () => {
      const dock = $('dock').classList.contains('hidden') ? 0 : $('dock').getBoundingClientRect().height;
      document.documentElement.style.setProperty('--dock-h', `${Math.ceil(dock)}px`);
      const content = document.querySelector('.content').getBoundingClientRect().height;
      const screen = window.visualViewport ? visualViewport.height : innerHeight;
      $('hero').style.height = `${Math.max(300, Math.floor(screen - content - dock - 12))}px`;
      // Отступы, которые не попали в замер, добираем по факту: сколько вылезло — на столько ниже фото.
      const overflow = document.documentElement.scrollHeight - screen;
      if (overflow > 0) {
        const height = $('hero').getBoundingClientRect().height;
        $('hero').style.height = `${Math.max(300, Math.floor(height - overflow))}px`;
      }
    };
    fit();
    // Шрифт догружается позже и меняет высоту текста — пересчитываем.
    if (document.fonts) document.fonts.ready.then(fit);
    addEventListener('resize', fit);
  }

  // Двойной тап по фото — сердечко, как лайк.
  function hearts() {
    let last = 0;
    let single = null;
    $('hero').addEventListener('pointerup', (e) => {
      const t = performance.now();
      if (t - last > 320) {
        last = t;
        // Один тап листает фото (если их несколько) — ждём, не будет ли второго.
        if ($('hero').dataset.slides) {
          const r = $('hero').getBoundingClientRect();
          const dir = e.clientX - r.left < r.width / 3 ? -1 : 1;
          single = setTimeout(() => $('hero').dispatchEvent(new CustomEvent('slide', { detail: dir })), 300);
        }
        return;
      }
      clearTimeout(single);
      last = 0;
      const r = $('hero').getBoundingClientRect();
      const h = document.createElement('span');
      h.className = 'heart';
      h.innerHTML = ICONS.heart;
      h.style.left = `${e.clientX - r.left}px`;
      h.style.top = `${e.clientY - r.top}px`;
      $('hero').append(h);
      if (navigator.vibrate) navigator.vibrate([10, 40, 18]);
      const anim = h.animate([
        { transform: 'scale(.2) rotate(-12deg)', opacity: 0 },
        { transform: 'scale(1.15) rotate(4deg)', opacity: 1, offset: .35 },
        { transform: 'scale(1) rotate(0)', opacity: 1, offset: .6 },
        { transform: 'scale(1.3) translateY(-40px)', opacity: 0 },
      ], { duration: reduced ? 1 : 1000, easing: 'cubic-bezier(.2,.8,.2,1)' });
      anim.onfinish = () => h.remove();
    });
  }

  // Отклик под пальцем: волна по кнопке и короткая вибрация (на Android).
  document.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn || reduced) return;
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    Object.assign(ripple.style, { width: `${size}px`, height: `${size}px`, left: `${e.clientX - r.left - size / 2}px`, top: `${e.clientY - r.top - size / 2}px` });
    btn.append(ripple);
    setTimeout(() => ripple.remove(), 650);
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.btn, .tag') && navigator.vibrate) navigator.vibrate(8);
  });

  const get = (path) => fetch(`${path}?t=${Date.now()}`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null));
  Promise.all([get(`c/${id}.json`), get(`c/${id}.extra.json`).catch(() => null)])
    .then(([card, extra]) => {
      if (!card) throw new Error('not found');
      const nameLine = render({ ...(extra || {}), ...card });
      const caret = document.createElement('span');
      caret.className = 'caret';
      type($('label'), $('label').dataset.type, 200, 22);
      type($('name'), nameLine, 700, 55, caret);
      fitToScreen();
      tilt();
      hearts();
      [...document.querySelectorAll('.bubble')].forEach((b, i) => {
        setTimeout(() => b.classList.add('shown'), reduced ? 0 : 1700 + i * 750);
      });
    })
    .catch(() => $('missing').classList.remove('hidden'));
})();
</script>
</body>
</html>
